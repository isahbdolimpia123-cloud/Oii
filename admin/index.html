
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Burguer Dog</title>
<style>
body{margin:0;padding:16px;background:#151515;color:white;font-family:Arial}
main{max-width:800px;margin:auto}
section{background:#242424;padding:16px;border-radius:12px;margin:15px 0}
input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:5px 0 12px;background:#111;color:white;border:1px solid #555;border-radius:7px}
button{padding:12px;border:0;border-radius:7px;background:#f5a623;font-weight:bold;margin:4px;cursor:pointer}
.product{border:1px solid #555;padding:12px;margin:10px 0;border-radius:9px;overflow-wrap:anywhere}
.hidden{display:none!important}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>🍔 Burguer Dog do Trecho</h1>
<p id="status">Entre com sua conta administradora.</p>

<section id="loginPanel">
<h2>Entrar</h2>
<form id="loginForm">
<label>E-mail</label>
<input id="email" type="email" required>
<label>Senha</label>
<input id="password" type="password" required>
<button id="loginButton">Entrar no painel</button>
</form>
</section>

<section id="appPanel" class="hidden">
<button id="logout">Sair</button>
<h2 id="formTitle">Cadastrar produto</h2>
<form id="productForm">
<input id="productId" type="hidden">
<label>Nome do produto</label>
<input id="name" required>
<label>Preço (R$)</label>
<input id="price" type="number" min="0" step="0.01" required>
<label>Categoria</label>
<select id="category">
<option>Hot Dogs</option>
<option>Hambúrgueres</option>
<option>Porções</option>
<option>Bebidas</option>
<option>Combos</option>
<option>Lanches</option>
<option>Outros</option>
</select>
<label>Descrição</label>
<textarea id="description"></textarea>
<label>Link da imagem (opcional)</label>
<input id="imageUrl" type="url" placeholder="https://...">
<label><input id="active" type="checkbox" checked style="width:auto"> Produto ativo</label>
<button id="saveButton">Salvar produto</button>
<button id="cancelEdit" type="button" class="hidden">Cancelar edição</button>
</form>
<hr>
<h2>Produtos cadastrados</h2>
<button id="refresh" type="button">Atualizar lista</button>
<div id="products"></div>
</section>
</main>

<script type="module">

status.textContent=t;
status.style.color=err?'#ff8585':'#9ee6ad';
}

async function loadProducts(){

title.textContent=p.name;

const desc=document.createElement('p');

}
}catch{}
}

const edit=document.createElement('button');
edit.textContent='Editar';
edit.onclick=()=>{
$('productId').value=p.id;
$('name').value=p.name||'';
$('price').value=p.price;
$('category').value=p.category||'Lanches';
$('description').value=p.description||'';

$('active').checked=!!p.active;
$('formTitle').textContent='Editar produto';
$('saveButton').textContent='Salvar alterações';
$('cancelEdit').classList.remove('hidden');
window.scrollTo(0,0);
};
card.appendChild(edit);

const toggle=document.createElement('button');
toggle.textContent=p.active?'Desativar':'Ativar';
toggle.onclick=async()=>{
toggle.disabled=true;
const next=!p.active;
const {error}=await db.from('products')
.update({active:next,available:next}).eq('id',p.id);
if(error)msg('Erro: '+error.message,true);
else{msg('Status atualizado.');await loadProducts();}
};
card.appendChild(toggle);
