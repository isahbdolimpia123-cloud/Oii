
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Burguer Dog do Trecho</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #151515;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #383838;
      border-radius: 18px;
      background: #222;
    }
    h1 { margin-top: 0; font-size: 25px; }
    p { color: #bbb; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #555;
      border-radius: 9px;
      background: #151515;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 9px;
      background: #f5a623;
      color: #171717;
      font-size: 16px;
      font-weight: bold;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🍔 Burguer Dog do Trecho</h1>
    <p>Painel administrativo. Entre com sua conta autorizada.</p>

    <form id="login">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Senha</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button id="submit" type="submit">Entrar no painel</button>
    </form>

    <p id="status" role="status"></p>
    <section id="dashboard" hidden>
      <h2>Login autorizado!</h2>
      <p>Você entrou no painel. Os módulos de produtos e pedidos ainda precisam ser conectados.</p>
      <button id="logout" type="button">Sair</button>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
      'https://kjkgzmrlypoatqoutkxy.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_OfxxVwaBXnWQdtMGVa0S5Q_PR2vyxBq';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.querySelector('#login');
    const status = document.querySelector('#status');
    const dashboard = document.querySelector('#dashboard');
    const submit = document.querySelector('#submit');

    async function checkAdmin(user) {
      const { data, error } = await supabase
        .from('admin_users')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (error) throw error;
      if (!data) throw new Error('Esta conta não tem permissão de administrador.');

      form.hidden = true;
      dashboard.hidden = false;
      status.textContent = 'Acesso autorizado.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      status.textContent = 'Verificando acesso...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.querySelector('#email').value.trim(),
          password: document.querySelector('#password').value
        });

        if (error) throw error;
        await checkAdmin(data.user);
      } catch (error) {
        status.textContent = error.message ||
          'Não foi possível entrar. Verifique sua conexão.';
      } finally {
        submit.disabled = false;
      }
    });

    document.querySelector('#logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      dashboard.hidden = true;
      form.hidden = false;
      form.reset();
      status.textContent = 'Você saiu do painel.';
    });

    const { data } = await supabase.auth.getUser();
    if (data.user) {
      try {
        await checkAdmin(data.user);
      } catch {
        await supabase.auth.signOut();
      }
    }
  </script>
</body>
</html>
